<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">

<link href="styles.css" rel="stylesheet">
<link href="pressmint.css" rel="stylesheet">
</head>
<body>
  <div id="controls">
    <label class="switch-container">
      <span class="switch">
        <input type="checkbox" data-param="regions" checked>
        <span class="slider"></span>
      </span>
      regions
    </label>
    <label class="switch-container">
      <span class="switch">
        <input type="checkbox" data-param="codes" checked>
        <span class="slider"></span>
      </span>
      codes
    </label>
    <label class="switch-container">
      <span class="switch">
        <input type="checkbox" data-param="logo" checked>
        <span class="slider"></span>
      </span>
      logo
    </label>
<button class="exportBtn" data-action="reset" title="Reset to defaults">↺ Reset</button>
<button class="exportBtn" data-action="share" title="Copy link to this map setup">🔗 Share</button>
<button class="exportBtn" data-action="svg" data-export title="Download SVG">⬇ SVG</button>
<button class="exportBtn" data-action="png" data-export title="Download PNG">⬇ PNG</button>
</div>
<svg id="map"></svg>

<script src="lib/map.js"></script>
<script src="pressmint.js"></script>
<script>
MintMap.render("#map", config);
</script>

</body>
</html>
