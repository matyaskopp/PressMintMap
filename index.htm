<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">

<link href="styles.css" rel="stylesheet">
<link href="pressmint.css" rel="stylesheet">
</head>
<body>
  <div id="controls">
    <label class="switch-container">
      <span class="switch">
        <input type="checkbox" id="regionToggle" data-param="regions" checked>
        <span class="slider"></span>
      </span>
      regions
    </label>
    <label class="switch-container">
      <span class="switch">
        <input type="checkbox" id="codeToggle" data-param="codes" checked>
        <span class="slider"></span>
      </span>
      codes
    </label>
    <label class="switch-container">
      <span class="switch">
        <input type="checkbox" id="logoToggle" data-param="logo" checked>
        <span class="slider"></span>
      </span>
      logo
    </label>
<button class="exportBtn" id="reset" title="Reset to defaults">↺ Reset</button>
<button class="exportBtn" id="share" title="Copy link to this map setup">🔗 Share</button>
<button class="exportBtn" id="exportSVG" title="Download SVG">⬇ SVG</button>
<button class="exportBtn" id="exportPNG" title="Download PNG">⬇ PNG</button>
</div>
<svg id="map"></svg>

<script src="pressmint.js"></script>
<script>

const btnSVG = document.querySelector("#exportSVG");
const btnPNG = document.querySelector("#exportPNG");
btnSVG.disabled = true;
btnPNG.disabled = true;
const keep = ["fill", "stroke", "stroke-width", "opacity", "font-size", "font-weight", "font-family", "text-anchor"];
let imageReady = false;

// web fonts are not available to an SVG rendered as an image -> embed them in the export
let exportFontCSS = "";
const fontReady = loadFontCSS(exportFontURL)
  .then(css => { exportFontCSS = css; })
  .catch(err => console.warn("export font not embedded:", err));



function rank(feature) {
    if (feature.properties.iso === "RU") return 0;
    if (PressMintEU.has(feature.properties.iso) || PressMintAF.has(feature.properties.iso)) return 2;
    return 1;
}

const height = window.innerHeight;
const width = height;

const svg = d3.select("#map");



// Projection focused on Europe
const projection = d3.geoMercator()
  .center([15, 55])   // Europe center
  .scale(500)
  .translate([width / 2, height / 2]);

const path = d3.geoPath().projection(projection);

d3.select("#regionToggle").on("change", function() {
  const isChecked = d3.select(this).property("checked");
  // Toggle the class on the top-level SVG container so children inherit the changes
  svg.classed("hide-reg", !isChecked);
});

d3.select("#codeToggle").on("change", function() {
  const isChecked = d3.select(this).property("checked");
  // Toggle the class on the top-level SVG container so children inherit the changes
  svg.classed("hide-code", !isChecked);
});

d3.select("#logoToggle").on("change", function() {
  const isChecked = d3.select(this).property("checked");
  // Toggle the class on the top-level SVG container so children inherit the changes
  svg.classed("hide-logo", !isChecked);
});

// reset to defaults: no highlighted/candidate countries, all switches on
d3.select("#reset").on("click", function() {
  svg.selectAll(".selected").classed("selected", false);
  svg.selectAll(".candidate").classed("candidate", false);
  svg.selectAll("text[data-candidate]").remove();
  d3.selectAll("#controls input[type=checkbox]")
    .property("checked", true)
    .dispatch("change");
  history.replaceState(null, "", location.pathname);
});

// share: current setup stored in url, e.g. ?selected=PL,UA&candidates=DE&hide=regions
function stateURL() {
  const ids = sel => [...document.querySelectorAll(sel)].map(e => e.id).sort().join(",");
  const params = new URLSearchParams();
  const selected = ids("#map path.selected");
  const candidates = ids("#map path.candidate");
  const hide = [...document.querySelectorAll("#controls input[data-param]")]
    .filter(i => !i.checked).map(i => i.dataset.param).join(",");
  if (selected) params.set("selected", selected);
  if (candidates) params.set("candidates", candidates);
  if (hide) params.set("hide", hide);
  const query = params.toString().replace(/%2C/g, ",");
  return location.origin + location.pathname + (query ? "?" + query : "");
}

d3.select("#share").on("click", function() {
  const url = stateURL();
  history.replaceState(null, "", url);
  const btn = this;
  const done = text => {
    btn.textContent = text;
    setTimeout(() => { btn.textContent = "🔗 Share"; }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(() => done("✓ Copied"), () => prompt("Map link:", url));
  } else {
    prompt("Map link:", url);
  }
});

// switches from url (?hide=regions,codes,logo)
function applyURLSwitches() {
  const hide = new Set((new URLSearchParams(location.search).get("hide") || "").split(","));
  d3.selectAll("#controls input[data-param]")
    .property("checked", function() { return !hide.has(this.dataset.param); })
    .dispatch("change");
}
applyURLSwitches();

// Load Natural Earth GeoJSON (via CDN)
Promise.all([
  d3.json("map.geojson"),
  d3.json("ua_fixed.geojson"),
  d3.json("ru_fixed.geojson")
  ]).then(([countries, ua_fixed, ru_fixed]) => {
    const ua = ua_fixed.features[0];
    const ru = ru_fixed.features[0];
    const replaced = countries.features.map(f => {
        if (f.properties.iso === "UA") return ua;
        if (f.properties.iso === "RU") return ru;
        return f;
      });
    const countriesOnly = replaced.filter(f => f.properties.level === "country");
    const regionsOnly = replaced.filter(f => f.properties.level === "region");
    console.log("COUNTRIES:", countriesOnly);
    console.log("REGIONS:", regionsOnly);
    const data = {
      type: "FeatureCollection",
      features: [...countriesOnly, ...regionsOnly]
    };
    
    console.log("Loaded", data);

    // Filter Europe
    const europe = {
      type: "FeatureCollection",
      //features: data.features.filter(d => europeISO.has(d.properties["iso2"]))
      features: data.features.filter(d => {
        return (d.properties.parent != "Africa" && parentAreas.has(d.properties.parent));
      })
    };

    const boxEU = {
      type: "FeatureCollection",
      features: europe.features.filter(d => {
        return boxCountriesEU.has(d.properties.iso);
      })
    };

    const africa = {
      type: "FeatureCollection",
      features: data.features.filter(d => {
        return (d.properties.parent == "Africa" || (PressMintAF.has(d.properties.iso)));
      })
    };

    const boxAF = {
      type: "FeatureCollection",
      features: africa.features.filter(d => {
        return boxCountriesAF.has(d.properties.iso);
      })
    };


    const shiftX = 5;
    const paddingLeft = 10;
    const paddingRight = 10;
    const paddingBottom = 5;
    const paddingTop = 35;
    const projection = d3.geoMercator()
      .fitExtent(
        [
          [paddingLeft+shiftX, paddingTop],
          [width - paddingRight + shiftX, height - paddingBottom]
        ],
        boxEU
      );
    // projection centered on Europe
    //const projection = d3.geoMercator()
    //  .fitSize([width, height], boxEU);
    const path = d3.geoPath().projection(projection);

    console.log("EUROPE:", europe);
    console.log("AFRICA:", africa);

    const defs = svg.append("defs");

    // stripes for candidate countries (colors in styles.css/pressmint.css)
    const stripes = defs.append("pattern")
      .attr("id", "candidate-stripes")
      .attr("patternUnits", "userSpaceOnUse")
      .attr("width", 8)
      .attr("height", 8)
      .attr("patternTransform", "rotate(45)");
    stripes.append("rect")
      .attr("class", "stripe-bg")
      .attr("width", 8)
      .attr("height", 8);
    stripes.append("rect")
      .attr("class", "stripe")
      .attr("width", 4)
      .attr("height", 8);
    svg.selectAll("path.eu")
      .data(europe.features.sort((a, b) => rank(a) - rank(b))) // send RU to the background (important when using non-patched version)
      .enter()
      .append("path")
      .attr("class", d =>
                         "area " + d.properties.level + (PressMintEU.has(d.properties.iso) || PressMintAF.has(d.properties.iso) ? " pressmint" : "")
            )
      .attr("code", d => d.properties.iso)
      .attr("id", d => d.properties.iso)
      .attr("name", d => d.properties.name)
      .attr("d", path);
    
    
    const [[ax0, ay0], [ax1, ay1]] = path.bounds(boxAF);
    const [cx, cy] = path.centroid(boxAF);
    const scale = 0.6;
    
    const refCountry = europe.features.find(d => d.properties.iso === "IS");
    const [[rx0, ry0], [rx1, ry1]] = path.bounds(refCountry);

    const targetX = rx0 + (rx1 - rx0) / 1.5; // almost-center horizontally on IS
    const targetY = ry0 + (ry1 - ry0) + (ay1-ay0); // place below IS
    

    /*
    defs.append("clipPath")
  .attr("id", "clip-pressmintAF")
  .append("rect")
  .attr("x", bx0)
  .attr("y", by0)
  .attr("width", bx1 - bx0)
  .attr("height", by1 - by0);
  */

  const r = Math.sqrt(Math.pow(ax1 - ax0, 2) + Math.pow(ay1 - ay0, 2)) / 2 * scale;
  defs.append("clipPath")
  .attr("id", "clip-pressmintAF")
  .append("circle")
  .attr("cx", cx)
  .attr("cy", cy)
  .attr("r", r);
  
    
    const gAfrica = svg.append("g").attr("clip-path", "url(#clip-pressmintAF)");

    gAfrica.selectAll("path.af")
      .data(africa.features)
      .enter()
      .append("path")
      .attr("class", d =>
                         "area " + d.properties.level + (PressMintAF.has(d.properties.iso) ? " pressmint" : "")
            )
      .attr("code", d => d.properties.iso)
      .attr("id", d => d.properties.iso)
      .attr("name", d => d.properties.name)
      .attr("d", path);   
      gAfrica.append("circle")
  .attr("cx", cx)
  .attr("cy", cy)
  .attr("r", r)
  .attr("fill", "none")
  .attr("stroke", "#9CB3C5")
  .attr("stroke-width", 10);   
  gAfrica.attr("transform", `
          translate(${targetX}, ${targetY})
          scale(${scale})
          translate(${-cx}, ${-cy})
        `);


  const africaInset = new Set(africa.features); // features drawn in scaled Africa inset

  // click toggles highlighting: PressMint country/region -> selected, other country -> candidate (striped + code)
  function toggleArea(path, on) {
    const el = d3.select(path);
    const d = el.datum();
    const cls = el.classed("pressmint") ? "selected" : "candidate";
    if (on === undefined) on = !el.classed(cls);
    if (el.classed(cls) === on) return;
    el.classed(cls, on);
    if (cls === "candidate") {
      if (on) {
        svg.append("text")
          .datum(d)
          .attr("data-candidate", d.properties.iso)
          .call(label);
      } else {
        svg.selectAll(`text[data-candidate="${d.properties.iso}"]`).remove();
      }
    }
  }

  svg.selectAll("path.area")
    .on("click", function() { toggleArea(this); });

  // add labels
  svg.selectAll("text")
  .data(europe.features.concat(africa.features))
  .enter()
  .append("text")
  .filter(d =>
    PressMintEU.has(d.properties.iso) ||
    PressMintAF.has(d.properties.iso)
  )
  .call(label);

  // highlighted countries from url (?selected=PL,UA&candidates=DE)
  const urlParams = new URLSearchParams(location.search);
  ["selected", "candidates"].forEach(param => {
    (urlParams.get(param) || "").split(",").filter(Boolean).forEach(iso => {
      const path = svg.select(`path.area[id="${CSS.escape(iso)}"]`).node();
      if (path) toggleArea(path, true);
      else console.warn(`unknown area in url (${param}):`, iso);
    });
  });

  function label(selection) {
    selection
      .attr("x", d => projectPoint(d)[0])
      .attr("y", d => projectPoint(d)[1])
      .attr("class", d => "label " + d.properties.level)
      .attr("text-anchor", "middle")
      .attr("alignment-baseline", "middle")
      .text(d => d.properties.iso);
  }

  function projectPoint(d) {
    const [x, y] = getMainlandCentroid(d);
    if (africaInset.has(d)) {
      return [
        targetX + (x - cx) * scale,
        targetY + (y - cy) * scale
      ];
    }

    return [x, y];
  }
  
  function getMainlandCentroid(feature) {
  let maxArea = 0;
  let bestPolygon = null;

  if (feature.geometry.type === "MultiPolygon") {
    feature.geometry.coordinates.forEach(polygon => {
      const area = d3.geoArea({ type: "Polygon", coordinates: polygon });
      if (area > maxArea) {
        maxArea = area;
        bestPolygon = polygon;
      }
    });

    return path.centroid({
      type: "Feature",
      geometry: {
        type: "Polygon",
        coordinates: bestPolygon
      }
    });
  }

  // simple polygon
  return path.centroid(feature);
  }

  
  loadImageAsBase64("logo.png", base64 => {
  svg.append("image")
    .attr("href", base64)
    .attr("x", rx1)
    .attr("y", paddingTop)
    .attr("width", 2*r)
    .attr("height", 2*r);
    imageReady = true;
    fontReady.then(() => requestAnimationFrame(() => {
      // requestAnimationFrame(downloadSVG);
        btnSVG.addEventListener("click", downloadSVG);
        btnSVG.disabled = false;
        btnPNG.addEventListener("click", downloadPNG);
        btnPNG.disabled = false;
        window.mapReady = true; // used by render-map.mjs (make map.png)
    }));
  });


  

})
  .catch(err => {
    console.error("LOAD FAILED:", err);
  });


function inlineStyles(svg) {
  //const elements = [svg, ...svg.querySelectorAll("*")];
  const elements = svg.querySelectorAll("*")
console.log(svg);

  elements.forEach(el => {
    const computed = window.getComputedStyle(el);
    let style = "";
    keep.forEach(prop => {
      // computed url() may be absolute (page url + #id), standalone SVG needs local reference
      const value = computed.getPropertyValue(prop).replace(/url\(["']?[^"')]*#([^"')]+)["']?\)/g, 'url(#$1)');
      if (value) style += `${prop}:${value};`;
    });

    el.setAttribute("style", style);
  });
}


function blobToDataURL(blob) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

// fetch font CSS (e.g. Google Fonts) and replace font file urls with data urls
async function loadFontCSS(url) {
  const css = await fetch(url).then(res => res.text());
  const urls = [...new Set([...css.matchAll(/url\((['"]?)(.*?)\1\)/g)].map(m => m[2]))];
  const data = await Promise.all(urls.map(u => fetch(u).then(res => res.blob()).then(blobToDataURL)));
  return urls.reduce((acc, u, i) => acc.split(u).join(data[i]), css);
}

function loadImageAsBase64(url, callback) {
  fetch(url)
    .then(res => res.blob())
    .then(blob => {
      const reader = new FileReader();
      reader.onloadend = () => callback(reader.result);
      reader.readAsDataURL(blob);
    });
}

function exportSVG() {
  const svgNode = document.getElementById("map");
  if (!imageReady) {
    console.warn("Image not ready yet");
    return;
  }
  // clone so you don’t destroy live DOM
  const clone = svgNode.cloneNode(true);
  //clone.style.position = "absolute";
  //clone.style.left = "-9999px";
  //clone.style.width="100vw";
  //clone.style.height="100vh";
  
  console.log(clone.querySelector("image"));

  document.body.appendChild(clone);
  inlineStyles(clone);

  // REMOVE ALL HIDDEN ELEMENTS (Works for CSS classes, stylesheets, and inline styles)
  const allElements = clone.getElementsByTagName("*");
  for (let i = allElements.length - 1; i >= 0; i--) {
    const el = allElements[i];
    if (window.getComputedStyle(el).display === "none") {
      el.remove();
    }
  }

  document.body.removeChild(clone);
  //clone.setAttribute("width", width);
  //clone.setAttribute("height", height);
  clone.removeAttribute("style"); // optional
  clone.style.background = "white";
  clone.setAttribute("viewBox", `0 0 ${width} ${height}`);
  if (exportFontCSS) {
    const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
    style.textContent = exportFontCSS;
    clone.insertBefore(style, clone.firstChild);
  }

  console.log(clone);


  const serializer = new XMLSerializer();
  let source = serializer.serializeToString(clone);

  // add XML header
  source = '<?xml version="1.0" standalone="no"?>\n' + source;

  return source;
}

function downloadSVG() {
  const svgString = exportSVG();

  const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "map.svg";
  a.click();

  URL.revokeObjectURL(url);
}


// render map as PNG, returns Promise<Blob>
function renderPNG(scale = 2) { // 2 = retina quality
  const svgString = exportSVG();

  return new Promise((resolve, reject) => {
    const img = new Image();
    const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    img.onerror = reject;
    img.onload = function () {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = width * scale;
      canvas.height = height * scale;

      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, width, height);

      URL.revokeObjectURL(url);

      canvas.toBlob(resolve, "image/png");
    };

    img.src = url;
  });
}

function downloadPNG() {
  renderPNG().then(blob => {
    const pngUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = pngUrl;
    a.download = "map.png";
    a.click();

    URL.revokeObjectURL(pngUrl);
  });
}

</script>

</body>
</html>
